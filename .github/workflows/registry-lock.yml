name: Resolve registry dependencies

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@jnpll"
      - name: Resolve published package and lockfile
        run: |
          npm pkg set 'dependencies.@jnpll/elements-ui=0.2.0'
          node -e 'const fs = require("node:fs"); const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8")); delete lock.packages["../elements-ui"]; delete lock.packages["node_modules/@jnpll/elements-ui"]; fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");'
          npx --yes npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund
          mkdir -p test-results/registry
          npm pack @jnpll/elements-ui@0.2.0 --pack-destination test-results/registry --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: registry-dependencies
          path: |
            package-lock.json
            test-results/registry/*.tgz
          retention-days: 1
